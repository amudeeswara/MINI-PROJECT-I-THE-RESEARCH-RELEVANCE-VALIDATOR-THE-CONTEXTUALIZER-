[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextualizer"
version = "0.1.0"
description = "The Contextualizer — a Research Relevance Validator that checks whether papers and references truly fit your research context."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["research", "relevance", "citations", "literature-review", "nlp", "validation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]
dev = ["pytest>=7"]

[project.scripts]
contextualizer = "contextualizer.cli:main"

[tool.setuptools.packages.find]
include = ["contextualizer*"]

[tool.setuptools.package-data]
contextualizer = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
